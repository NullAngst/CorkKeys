name: devtest

# Runs the device test on an emulator when the devtest branch is pushed, and commits the
# screenshots and results to the devtest-results branch. Kept off main, like Corkboard's.
on:
  push:
    branches: [devtest]

permissions:
  contents: write

jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build debug APK
        run: bash ./gradlew --no-daemon assembleDebug

      # Lets the emulator use hardware acceleration on GitHub's runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the device test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: bash .github/devtest/devtest.sh

      - name: Annotate the results
        if: always()
        run: |
          [ -f devtest/results.txt ] || exit 0
          printf '::notice title=Device test::%s\n' "$(sed -e 's/%/%25/g' devtest/results.txt devtest/steps.txt | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')"

      - name: Commit results to devtest-results
        if: always()
        run: |
          [ -d devtest ] || exit 0
          sha=$(git rev-parse HEAD)
          cd devtest
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b devtest-results
          git add -A
          git commit -q -m "Device test results for $sha"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" devtest-results
